[project]
name = "prakash-agent"
version = "1.0.0"
description = "LangGraph catalog ingestion agent for Prakash Watch Co."
requires-python = ">=3.11"
dependencies = [
    "langgraph>=1.2,<2",
    "pydantic>=2.11",
    "httpx>=0.28",
    "openpyxl>=3.1",
    "beautifulsoup4>=4.13",
    "lxml>=5.3",
    "pillow>=11.0",
    "python-dotenv>=1.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "python-multipart>=0.0.20",
]

[project.scripts]
prakash-agent = "prakash_agent.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["prakash_agent"]
